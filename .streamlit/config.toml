# Configuración de Streamlit para este proyecto.
# Se carga automáticamente al arrancar la app con `streamlit run`.

[theme]
base = "dark"
primaryColor = "#3ea6ff"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#111c31"
textColor = "#e6eefc"
font = "sans serif"

[server]
# No abrir el navegador automáticamente (start.bat ya lo indica)
headless = false
port = 8501
# Tamaño máximo de archivo subido (referencias de estilo)
maxUploadSize = 30

[browser]
gatherUsageStats = false
